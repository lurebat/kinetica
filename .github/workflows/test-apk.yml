name: Test APK

on:
  push:
    branches: ['apk/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew assembleDebug test
      - uses: actions/upload-artifact@v4
        with:
          name: kinetica-dev-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            app/build/outputs/apk/debug/*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Hebrew layout test build" \
            --notes "Debug build (com.kinetica.keyboard.dev) of $GITHUB_SHA. Installs alongside the released keyboard with separate settings."
